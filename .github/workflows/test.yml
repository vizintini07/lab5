name: CI Tests

# Запускать при push и pull request в основные ветки
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    # Используем ваш локальный раннер на виртуальной машине
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Устанавливаем flask и pytest напрямую, чтобы тесты точно запустились
        pip install flask pytest
        # Если у вас есть другие зависимости в файле, раскомментируйте строку ниже:
        # pip install -r requirements.txt

    - name: Run tests
      run: |
        # Запускаем pytest для проверки всех тестов (v1 и v2)
        pytest test_app.py
